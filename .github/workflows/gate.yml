name: gate
# The fold engine's gate: the vendored pieces equal their upstream files at the pinned commits; the tests pass (the
# measurement and the demo run re-derived from shipped data); every file of logic is mutation-gated CLEAN by witness
# v0.6 with no exemptions and its counts match data/gates.json (what the page shows); the kernel's, the measurement's
# and the page's exports are fuzzed; and index.html is a fixpoint of its build.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: witness v0.6
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness
      - name: vendored pieces equal upstream at their pinned commits
        run: node --test test/vendor.test.mjs
      - name: tests
        run: node --test test/fold.test.mjs test/genome.test.mjs test/cell.test.mjs test/writer.test.mjs test/cli.test.mjs test/measure.test.mjs test/measure-data.test.mjs test/page.test.mjs test/prepare.test.mjs test/page-built.test.mjs
      - name: mutation gates — every file of logic CLEAN, counts as recorded in data/gates.json
        run: node scripts/gates.mjs
      - name: fuzz — every export of the kernel, the measurement and the page gives a result on hostile input, never a throw
        run: |
          fuzz() { for fn in "${@:2}"; do node .witness/witness.mjs fuzz "$1" "$fn" | tee fuzz.out
            grep -q '"neverThrows": true' fuzz.out || { echo "::error::$1 $fn throws on hostile input"; exit 1; }; done; }
          fuzz src/fold.mjs docsOf passagesOf buildIndex isIndex terms answer judgeRecord inLaneOf act laneQuestions chooseLane alter cases draftSeed preview fold engineJudge engineLane
          fuzz src/measure.mjs r4 atLeast atMost extractS1 docdecRef containsGold cellOf rows metrics measureS1
          fuzz src/page.mjs esc badge passageHtml answerHtml checksHtml laneHtml casesHtml foldHtml measureRows docsFromPaste slug
      - name: page fixpoint — index.html is what the build makes
        run: |
          node scripts/make-page.mjs
          git diff --exit-code index.html || { echo "::error::index.html is stale: run node scripts/make-page.mjs and commit it"; exit 1; }
